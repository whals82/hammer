<script>
/* 톡쾅 — 가벼운 흑백 리듬게임 (파일 하나로 끝난다)

(function () {
  'use strict';

  /* ---------- 기본 ---------- */

  const TEST = /[?&]test\b/.test(location.search);       // 자동 검증용: 소리를 끄고, 창이 가려져도 돌게 타이머로 돌린다

   * 지금 파일(BUILD)보다 새 판이 올라와 있으면 주소 뒤에 ?v=새번호 를 붙여 한 번 다시 연다.

  const BUILD = '20261115-182536';

    fetch('version.txt?' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).then((v) => {

  try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* 저장을 못 쓰는 브라우저 */ }

  /* ---------- 소리 ----------

  const Au = (function () {

    function makeSounds() {

      B.tik = make(0.08, (d, sr) => { tone(d, sr, 0, 0.035, 2300, 1900, 0.5); tone(d, sr, 0, 0.05, 940, 820, 0.35, 2); hiss(d, sr, 0, 0.008, 0.45, 1); });

      const bang = (d, sr, v, ring) => {
        hiss(d, sr, 0, 0.006, 0.9 * v, 1);
        hiss(d, sr, 0, 0.03, 0.5 * v, 1);                                    // 갈라지는 "짝"
        tone(d, sr, 0, 0.3, 165, 36, 1.15 * v, 0, 1.6);
        tone(d, sr, 0, 0.1, 330, 190, 0.55 * v, 2);
        tone(d, sr, 0, 0.05, 640, 300, 0.4 * v, 2);                          // 나무 "톡"
        hiss(d, sr, 0, 0.06, 0.5 * v, 0);
        tone(d, sr, 0, 0.14, 2140, 2140, 0.13 * ring, 0, 3); tone(d, sr, 0, 0.11, 3270, 3270, 0.09 * ring, 0, 3); tone(d, sr, 0, 0.08, 4490, 4490, 0.05 * ring, 0, 3);

      B.hitG = make(0.32, (d, sr) => bang(d, sr, 0.8, 0.7));

      B.boom = make(0.62, (d, sr) => { bang(d, sr, 1.15, 1); tone(d, sr, 0, 0.55, 110, 30, 0.9, 0, 1.3); hiss(d, sr, 0, 0.14, 0.45, 0); tone(d, sr, 0.012, 0.36, 1568, 1568, 0.12, 0, 3); });

      B.crack = make(0.5, (d, sr) => {
        hiss(d, sr, 0, 0.02, 1, 1); hiss(d, sr, 0.01, 0.2, 0.9, 0); tone(d, sr, 0, 0.26, 140, 40, 1, 0, 1.5); tone(d, sr, 0.02, 0.12, 520, 180, 0.4, 1, 2);
        for (let k = 0; k < 7; k++) hiss(d, sr, 0.04 + k * 0.032 + Math.random() * 0.012, 0.014, 0.65 - k * 0.06, 1);
      });
      // 뿅망치
      B.pyong = make(0.28, (d, sr) => { tone(d, sr, 0, 0.11, 520, 1500, 0.5, 0, 1.2); tone(d, sr, 0.1, 0.15, 1500, 900, 0.4, 0, 1.5); tone(d, sr, 0, 0.05, 260, 130, 0.5, 2); });

      B.stick = make(0.05, (d, sr) => { hiss(d, sr, 0, 0.012, 0.6, 1); tone(d, sr, 0, 0.035, 1250, 1100, 0.45, 2); });
      B.stickHi = make(0.05, (d, sr) => { hiss(d, sr, 0, 0.012, 0.6, 1); tone(d, sr, 0, 0.035, 1700, 1500, 0.5, 2); });
      B.combo = make(0.5, (d, sr) => { [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => tone(d, sr, i * 0.05, 0.3, f, f, 0.2, 2, 2.5)); });
      B.end = make(1.0, (d, sr) => { [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) => { tone(d, sr, i * 0.08, 0.6, f, f, 0.26, 2, 2.2); tone(d, sr, i * 0.08, 0.3, f * 2, f * 2, 0.08); }); });

    }
    /* 네 마디(열여섯 박)짜리 반주 한 바퀴: 북(쿵·탁·칫), 베이스, 엇박 건반, 짧은 가락. 마디마다 화음이 바뀐다.
     * 박 길이는 녹음 길이(표본 수)에서 거꾸로 구해 돌려준다. 그 값으로 박자를 세면 몇 바퀴를 돌아도 어긋나지 않는다 */
    function makeLoop(bpm, tr) {

      wrapLen = len;

        const o = bar * 4, root = R * st(chord[bar]), third = root * st(minor[bar] ? 3 : 4), fifth = root * st(7);
        [0, 1.5, 2].forEach((bt) => tone(d, sr, (o + bt) * spb, 0.2, 140, 44, 0.85, 0, 1.6));                     // 쿵
        if (bar === 3) tone(d, sr, (o + 3.5) * spb, 0.16, 140, 50, 0.6, 0, 1.6);
        [1, 3].forEach((bt) => { hiss(d, sr, (o + bt) * spb, 0.13, 0.42, 0); hiss(d, sr, (o + bt) * spb, 0.03, 0.4, 1); tone(d, sr, (o + bt) * spb, 0.07, 210, 170, 0.3, 2); });   // 탁
        for (let k = 0; k < 8; k++) hiss(d, sr, (o + k / 2) * spb, k % 2 ? 0.02 : 0.03, k % 2 ? 0.09 : 0.15, 1);   // 칫칫

        bass(0, root); bass(1, root * 2, 0.7, 0.12); bass(1.5, root, 0.9); bass(2.5, fifth, 0.8); bass(3, root * 2, 0.7, 0.12); bass(3.5, bar === 3 ? fifth * st(2) : fifth, 0.8);

      }

    let probe = null, tag = null;

      if (bus) { try { bus.disconnect(); } catch (e) { /* 이미 끊김 */ } }

      bus.connect(master);
      if (probe) bus.connect(probe);

        s.buffer = buffer; s.loop = true;

        s.start(t); s.stop(tEnd);
      },
      hush() { if (ctx) newBus(); },                                         // 예약해 둔 소리를 모두 끊는다
      setMute(m) { if (master) master.gain.value = m || TEST ? 0 : 0.9; },
      now() { return ctx.currentTime; },
      latency() { return ctx.outputLatency || ctx.baseLatency || (TOUCH ? 0.02 : 0); },
      suspend() { if (ctx) ctx.suspend(); },
      resume() { if (ctx) ctx.resume(); },
      get state() { return ctx ? ctx.state : 'none'; },
      level() {                                                              // 검증용: 지금 흘러나가는 소리의 세기 (스피커로는 내지 않고 잰다)
        if (!ensure()) return -1;
        if (!probe) { probe = ctx.createAnalyser(); probe.fftSize = 2048; bus.connect(probe); }
        const d = new Float32Array(probe.fftSize);
        probe.getFloatTimeDomainData(d);
        let pk = 0;
        for (let i = 0; i < d.length; i++) { const a = d[i] < 0 ? -d[i] : d[i]; if (a > pk) pk = a; }
        return +pk.toFixed(3);
      },
      info() {                                                              // 검증용: 만들어 둔 소리마다 길이·가장 큰 값·평균 세기
        if (!ensure()) return null;
        const stat = (b) => { const d = b.getChannelData(0); let pk = 0, sq = 0, bad = 0; for (let i = 0; i < d.length; i++) { const v = d[i]; if (v !== v) bad++; const a = v < 0 ? -v : v; if (a > pk) pk = a; sq += v * v; } return [+(d.length / b.sampleRate).toFixed(3), +pk.toFixed(2), +Math.sqrt(sq / d.length).toFixed(3), bad]; };
        const out = {};
        Object.keys(B).forEach((k) => { out[k] = stat(B[k]); });
        const lp = makeLoop(100, 0);
        out.loop100 = stat(lp.buffer).concat(+lp.spb.toFixed(5));
        return out;
      },
      get ctx() { return ctx; },
      get running() { return !!ctx && ctx.state === 'running'; }
    };
  })();

  /* ---------- 스테이지 ----------
   * 한 마디는 문자열 하나. 띄어 쓴 네 묶음이 1·2·3·4박이고, 묶음 안의 글자 수만큼 그 박을 똑같이 나눈다. x = 손이 못을 꽂는 자리, - = 쉼.
   *   'x' 정박 / 'xx' 반 박 둘 / '-x' 엇박 / 'xxx' 셋잇단 / 'xx--' 반의 반 박 둘.   꽂은 못은 언제나 정확히 한 박 뒤에 친다 */
  const HOW = TOUCH ? '화면을 톡' : '스페이스';
  const STAGES = [
    { id: 'p', name: '연습', sub: '천천히 배우기', bpm: 88, tr: 0, practice: true,
      bars: ['x - x -', 'x - x -', 'x - - -', 'xx - x -', 'x - xx -', 'xx - xx -'],
      caps: ['손이 못을 꽂으면("틱") 한 박 뒤에 쾅!', '못이 망치 밑 동그라미에 오는 순간 ' + HOW, '하나만 올 때도 있어요', '빨리 두 개를 꽂으면, 똑같이 빨리 두 번', '틱, 틱틱 → 쾅, 쾅쾅', '잘했어요! 다음은 1단계'] },
    { id: 's1', name: '1단계', sub: '또박또박', bpm: 100, tr: 0,
      bars: ['x - x -', 'x - x -', 'xx - x -', 'x - xx -', 'x - x -', 'xx - xx -', 'x - x -', 'xx - xx -',
        'x - - -', 'xx - x -', 'x - xx -', 'xx - xx -', 'x - x -', 'xx - xx -', 'xx - xx -', 'x - - -'] },
    { id: 's2', name: '2단계', sub: '이어 치기', bpm: 112, tr: 3,
      bars: ['x - x -', 'x x - -', 'x x x -', 'xx - x -', '-x - x -', 'x x x x', '- - xx -', '-x - -x -',
        'x x xx -', 'xx - xx -', 'x -x x -', 'x x x x', 'xx x - -', '-x -x - -', 'x x xx -', 'x - - -'] },
    { id: 's3', name: '3단계', sub: '잰걸음', bpm: 126, tr: 5,
      bars: ['xx - xx -', 'x x x x', 'xxx - x -', 'x - xxx -', 'xx-- - x -', 'x x xx xx', '-x x -x x', 'xxx - xxx -',
        'xx xx - -', 'x -x xx -', 'xx-- - xx-- -', 'x x x xx', 'xxx x xxx -', '-x -x -x -', 'xx xx xx -', 'x - - -'] },
    { id: 's4', name: '4단계', sub: '불망치', bpm: 140, tr: 7,
      bars: ['x x x x', 'xx - xx -', 'xx x xx x', 'xxx - xxx -', '-x -x x x', 'xx xx - xx', 'x xxx x -', 'xx-- x xx-- x',
        '-x xx -x xx', 'xxx xxx - -', 'x x xx xx', 'xx -x xx -x', 'xxx x xx x', 'xx xx xx -', 'xxx xxx xxx -', 'x - - -'] }
  ];
  const stageById = (id) => (id === 'smash' ? SMASH : STAGES.filter((s) => s.id === id)[0]);   // 'smash' = 부수기 모드
  function parse(bar) {                                  // 한 마디 → 못을 꽂는 박 위치들
    const out = [];
    bar.split(' ').forEach((grp, beat) => { for (let k = 0; k < grp.length; k++) if (grp[k] === 'x') out.push(beat + k / grp.length); });
    return out;
  }

  /* ---------- 망치 ----------

   * smash = 부수기 모드에서 한 번 칠 때 판자를 깎는 힘(판자 한 장의 단단함은 6) */
  const HAMMERS = [
    { id: 'basic', name: '기본 망치', desc: '손에 익은\n보통 망치', win: 1, pow: 1, crack: 0, need: null, smash: 3 },
    { id: 'slim', name: '좁은 망치', desc: '머리가 좁아서\n정확히 쳐야 해요', win: 0.75, pow: 0.8, crack: 0, need: 's1', smash: 2 },
    { id: 'big', name: '큰 망치', desc: '맞히기 쉬워요.\n잘못 치면 금이 쩍!', win: 1.3, pow: 1.3, crack: 1, need: 's2', smash: 4 },

    { id: 'toy', name: '뿅망치', desc: '뿅! 소리가 나는\n장난감 망치', win: 1.15, pow: 0.7, crack: 0, need: 's4', smash: 1 }
  ];
  const unlocked = (h) => !h.need || (!!store.best[h.need] && store.best[h.need].grade !== 'F');
  const rawHammer = (id) => HAMMERS.filter((h) => h.id === id)[0] || HAMMERS[0];
  const hammerById = (id) => { const h = rawHammer(id); return unlocked(h) ? h : HAMMERS[0]; };   // 아직 안 열린 망치면 기본 망치

  /* ---------- 한 판 ---------- */
  const INTRO = 4;                                       // 시작 전에 세는 박
  const TAIL = 2;                                        // 마지막 마디 뒤의 여유
  const OUTRO = 2.5;                                     // 끝나고 결과 화면까지
  const LAG = 1;                                         // 꽂은 뒤 몇 박 뒤에 치는가
  const WIN = { perfect: 0.055, good: 0.11, bad: 0.17 }; // 판정 폭(초)
  const PTS = { perfect: 100, good: 60, bad: 20, miss: 0 };
  const MILES = [10, 20, 30, 50, 75, 100];
  // 배치: 판자는 한 박에 D 만큼 왼쪽으로 흐른다. 손은 PX 에서 꽂고, 망치는 그보다 한 박 거리 왼쪽인 SX 를 내리친다
  const BH = 120;                                        // 판자 두께
  const NH = 110;                                        // 서 있는 못의 길이
  const UPA = -0.62;                                   // 망치를 들고 있는 각도
  const DOWNA = { perfect: 0, good: -0.065, bad: -0.125, whiff: 0.025 };   // 내리친 각도: 덜 박을수록 덜 내려간다
  const REST = 150;                                      // 손이 쉬는 높이
  /* 가로 화면과 세로 화면은 자리가 다르다. layout(세로인가)이 한꺼번에 정한다 (fit 이 부른다).
   * 세로 화면은 폭이 좁아서 한 박 거리(D)를 조금 줄이고, 장면을 가운데보다 위에 두어 아래쪽을 엄지가 누를 자리로 비운다 */
  let PORT = false;                                      // 지금 세로 화면 배치인가
  let PY, SX, D, PX, TILE, HPX, HPY, MIDX, PBX, PBY;
  function layout(port) {
    PORT = port;
    W = port ? 720 : 1280;
    H = port ? 1280 : 720;
    PY = port ? 780 : 500;                               // 판자 윗면
    SX = port ? 220 : 380;                               // 망치가 내리치는 자리
    D = port ? 320 : 380;                                // 한 박에 판자가 흐르는 거리
    PX = SX + D * LAG;                                   // 손이 못을 꽂는 자리
    TILE = D * 2;                                        // 나뭇결이 되풀이되는 폭
    HPX = SX - 400;                                      // 망치 자루 끝(도는 축)
    HPY = PY - 14 - 94;
    MIDX = port ? 360 : 560;                             // 점수·큰 글자의 가운데 (가로 화면은 망치와 손 사이의 빈 자리)
    PBX = port ? 24 : 1160;                              // 멈춤 단추: 가로 화면은 오른쪽 아래, 세로 화면은 엄지가 닿지 않는 왼쪽 위
    PBY = port ? 24 : 640;
  }
  layout(store.view === 'port');

  let S = null;                                          // 지금 판
  let screen = 'title', dirty = true, newBest = false, menuAt = 0;

  function botErr(bot) {
    return bot === 'good' ? (Math.random() < 0.5 ? -0.08 : 0.08) : bot === 'late' ? 0.13 : bot === 'later' ? 0.18 : bot === 'sloppy' ? (Math.random() * 2 - 1) * 0.16 : 0;
  }

  /* 판을 차린다. opt.virtual = 화면·소리 없이 계산으로만 돌릴 때, opt.bot = 자동으로 치는 손(perfect|good|late|sloppy|none) */
  function begin(stage, opt) {
    if (stage.smash) { beginSmash(stage, opt); return; } // 부수기 모드는 판 차림이 따로 있다
    opt = opt || {};
    if (Au.ctx) Au.hush();
    const audio = !opt.virtual && Au.running;
    let spb = 60 / stage.bpm, loop = null;
    if (audio) { loop = Au.makeLoop(stage.bpm, stage.tr); spb = loop.spb; }
    const notes = [];
    stage.bars.forEach((bar, i) => parse(bar).forEach((tb) => {
      const cb = INTRO + i * 4 + tb;
      notes.push({ cue: cb * spb, hit: (cb + LAG) * spb, q: null, dir: 1, err: botErr(opt.bot) });
    }));
    const hm = opt.hammer ? rawHammer(opt.hammer) : hammerById(store.hammer);   // 이번 판에 쓸 망치
    S = {
      hm, win: { perfect: WIN.perfect * hm.win, good: WIN.good * hm.win, bad: WIN.bad * hm.win }, marks: [], scareAt: -9, hopAt: -9, broken: 0,
      stage, spb, notes, bars: stage.bars.length, end: INTRO + stage.bars.length * 4 + TAIL, practice: !!stage.practice,
      virtual: !!opt.virtual, bot: opt.bot || null, audio, t0: 0, base: 0, frozen: null, paused: false, done: false, ended: false,
      lo: 0, sched: 0, ci: 0, vis: 0, score: 0, max: stage.practice ? 0 : notes.length * 100, combo: 0, maxCombo: 0, comboAt: -9,
      counts: { perfect: 0, good: 0, bad: 0, miss: 0 }, whiffs: 0, presses: 0,
      fx: [], strike: null, shakeAt: -9, shakeAmp: 0, zoom: 0, dipAt: -9, dipAmp: 0, res: null
    };
    if (audio) {
      S.t0 = Au.now() + 0.3;                                                 // 0박이 울리는 소리 시계 시각
      for (let k = 0; k < 4; k++) Au.at(k === 3 ? 'stickHi' : 'stick', S.t0 + k * spb);
      Au.loop(loop.buffer, S.t0 + INTRO * spb, S.t0 + S.end * spb);
      Au.at('end', S.t0 + S.end * spb);
    } else if (!opt.virtual) S.base = performance.now() / 1000 + 0.3;
  }

  /* 지금 들리는 소리가 0박에서 몇 초 지났는가 */
  function now() {
    if (S.frozen != null) return S.frozen;
    return S.audio ? Au.now() - Au.latency() - store.offset / 1000 - S.t0 : performance.now() / 1000 - S.base;
  }
  /* 곧 나올 "틱"을 미리 예약한다 */
  function schedule() {
    if (!S.audio) return;
    const horizon = Au.now() + 1.2;
    while (S.sched < S.notes.length && S.t0 + S.notes[S.sched].cue < horizon) Au.at('tik', S.t0 + S.notes[S.sched++].cue, 1.25);
  }
  const sfx = (name, vol) => { if (S.audio) Au.at(name, 0, vol); };
  const buzz = (ms) => { if (!S.virtual && !S.bot && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* 무시 */ } } };

  function breakCombo(t) {
    if (S.combo >= 10) S.fx.push({ type: 2, str: '콤보 끊김', t, life: 0.7, c: GRAY });
    S.combo = 0;
  }
  function chips(t, n) {                                 // 튀는 나뭇조각
    if (lite) n = Math.ceil(n / 2);
    const parts = [];
    for (let k = 0; k < n; k++) parts.push({ vx: (Math.random() - 0.5) * 760, vy: -(260 + Math.random() * 420), rot: (Math.random() - 0.5) * 30, a: Math.random() * 3 });
    S.fx.push({ type: 3, t, life: 0.55, parts });
  }
  /* 무거운 망치로 잘못 쳤다: 판자에 금이 가거나(1) 박살 난다(2). 자국은 판자에 남아 함께 흘러간다 */
  function wreck(t, level) {
    const pts = [];                                      // 깨진 자리의 들쭉날쭉한 모양 (칠 때마다 다르다)
    for (let k = 0; k < 9; k++) pts.push(Math.random());
    S.marks.push({ t, level, pts });
    S.shakeAt = t;
    S.dipAt = t;
    if (level > 1) {
      const parts = [];
      for (let k = 0; k < (lite ? 5 : 9); k++) parts.push({ vx: (Math.random() - 0.5) * 900, vy: -(300 + Math.random() * 560), rot: (Math.random() - 0.5) * 22, a: Math.random() * 3, w: 16 + Math.random() * 26, h: 8 + Math.random() * 10 });
      S.fx.push({ type: 7, t, life: 0.8, parts }, { type: 6, str: '우지끈!', t, life: 0.6, size: 92 });
      S.shakeAmp = 20; S.zoom = 0.05; S.dipAmp = 22;
      S.scareAt = t;                                     // 손이 깜짝 놀란다
      S.broken++;
      sfx('crack'); buzz(40);
    } else {
      S.fx.push({ type: 6, str: '쩍!', t, life: 0.45, size: 72 });
      S.shakeAmp = 9; S.zoom = 0.015; S.dipAmp = 10;
      sfx('crack', 0.55); buzz(20);
    }
  }
  function judge(n, q, t) {
    for (let k = S.fx.length - 1; k >= 0; k--) if (S.fx[k].type === 0 || S.fx[k].type === 6) S.fx.splice(k, 1);   // 앞 판정 글자가 남아 있으면 지운다 (빠른 못에서 글자가 겹치지 않게)
    const h = S.hm, toy = h.id === 'toy', heavy = h.id === 'sledge';
    n.q = q;
    n.dir = t >= n.hit ? 1 : -1;                         // 늦게 치면 오른쪽으로, 빨리 치면 왼쪽으로 기운다
    if (!S.practice) { S.counts[q]++; S.score += PTS[q]; }
    if (q === 'miss') {
      breakCombo(t);
      S.fx.push({ type: 0, str: '놓침', t, life: 0.5, size: 40, c: GRAY });
      return;
    }
    S.strike = { t, q, seen: false, at: 0 };
    S.shakeAt = t;
    S.dipAt = t;
    const side = n.dir > 0 ? '늦음' : '빠름';
    if (q === 'perfect') {
      S.shakeAmp = 13 * h.pow; S.zoom = 0.04 * Math.min(1.5, h.pow); S.dipAmp = 12 * h.pow;
      sfx(toy ? 'pyong' : heavy ? 'boom' : 'hitP'); buzz(18);
      S.fx.push({ type: 1, under: true, t, life: 0.13, r: 150 * (0.7 + 0.3 * h.pow), rot: Math.random() * 6 }, { type: 5, under: true, t, life: 0.12, rot: Math.random() * 6 },
        { type: 4, under: true, t, life: 0.3 }, { type: 6, str: toy ? '뿅!' : heavy ? '콰앙!' : '쾅!', t, life: 0.42, size: heavy ? 122 : 104 }, { type: 0, str: '완벽!', t, life: 0.5, size: 50 });
      chips(t, Math.round(9 * h.pow));
      if (heavy) S.hopAt = t;                            // 묵직한 한 방에 서 있는 못들이 들썩인다
    } else if (q === 'good') {
      S.shakeAmp = 7 * h.pow; S.zoom = 0.02 * Math.min(1.5, h.pow); S.dipAmp = 7 * h.pow;
      sfx(toy ? 'pyong' : 'hitG', toy ? 0.7 : undefined); buzz(10);
      S.fx.push({ type: 1, under: true, t, life: 0.11, r: 100 * (0.7 + 0.3 * h.pow), rot: Math.random() * 6 }, { type: 4, under: true, t, life: 0.3 },
        { type: 6, str: toy ? '뿅' : '쿵', t, life: 0.36, size: 76 }, { type: 0, str: '좋아 · ' + side, t, life: 0.5, size: 42 });
      chips(t, Math.round(4 * h.pow));
    } else {
      S.shakeAmp = 3; S.zoom = 0; S.dipAmp = 3;
      sfx('bad');
      S.fx.push({ type: 0, str: '삐끗 · ' + side, t, life: 0.5, size: 42 });
      if (h.crack) wreck(t, h.crack);                    // 무거운 망치로 삐끗하면 판자가 상한다
    }
    if (q === 'bad') { breakCombo(t); return; }
    S.combo++;
    S.comboAt = t;
    if (S.combo > S.maxCombo) S.maxCombo = S.combo;
    if (MILES.indexOf(S.combo) >= 0) { S.fx.push({ type: 2, str: S.combo + ' 콤보!', t, life: 0.8 }); sfx('combo'); }
  }
  const grade = (d) => (d <= S.win.perfect ? 'perfect' : d <= S.win.good ? 'good' : d <= S.win.bad ? 'bad' : null);

  /* 눌렀다. t = 누른 순간(0박에서 몇 초) */
  function press(t) {
    if (!S || S.done) return;
    S.presses++;
    if (S.sm) { smashHit(t); return; }                   // 부수기 모드: 누를 때마다 바닥을 친다
    const win = S.win;
    let first = null, best = null, bestD = 9;
    for (let k = S.lo; k < S.notes.length; k++) {
      const n = S.notes[k];
      if (n.q) continue;
      const d = t - n.hit;
      if (d < -win.bad) break;
      const ad = Math.abs(d);
      if (ad <= win.bad) { if (!first) first = n; if (ad < bestD) { best = n; bestD = ad; } }
    }
    // 빠른 못이 이어질 때: 앞 못이 '좋아' 안에 들면 앞 못부터 맞힌 것으로 본다
    if (first && first !== best && Math.abs(t - first.hit) <= win.good) { best = first; bestD = Math.abs(t - first.hit); }
    if (best) { judge(best, grade(bestD), t); return; }
    S.whiffs++;                                          // 헛손질: 맨 판자를 친다
    S.strike = { t, q: 'whiff', seen: false, at: 0 };
    S.shakeAt = t; S.shakeAmp = 3; S.zoom = 0; S.dipAt = t; S.dipAmp = 4;
    S.fx.push({ type: 4, under: true, t, life: 0.25 });
    if (S.hm.crack) wreck(t, S.hm.crack); else sfx('whiff');
    if (t >= INTRO * S.spb) breakCombo(t);
  }

  function advance(t) {
    while (S.lo < S.notes.length && S.notes[S.lo].q) S.lo++;
    for (let k = S.lo; k < S.notes.length; k++) {
      const n = S.notes[k];
      if (n.q) continue;
      if (n.hit - t > 1) break;
      if (S.bot && S.bot !== 'none' && t >= n.hit + n.err) { press(n.hit + n.err); continue; }
      if (t > n.hit + S.win.bad) judge(n, 'miss', t);
    }

  const smashBest = () => { const r = store.smash || {}; let b = 0; Object.keys(r).forEach((k) => { if (r[k] > b) b = r[k]; }); return b; };   // 어느 망치로든 가장 깊이 내려간 기록
  const depthName = (n) => (n > 0 ? '지하 ' + n + '층' : '1층');
  /* 아직 덜 내려온 거리(px). 판자나 바닥이 부서지면 그만큼 늘었다가 금방 0 으로 줄어든다: 이 값만큼 바닥을 아래에 그려서 "내려가는" 것처럼 보인다 */
  const smashOff = (m, t) => { const o = m.off * Math.exp(-Math.max(0, t - m.offAt) * 16); return o < 0.5 ? 0 : o; };
  const chunkParts = (n) => {                            // 사방으로 튀는 판자 토막
    const parts = [];
    for (let k = 0; k < n; k++) parts.push({ vx: (Math.random() - 0.5) * 900, vy: -(300 + Math.random() * 560), rot: (Math.random() - 0.5) * 22, a: Math.random() * 3, w: 16 + Math.random() * 26, h: 8 + Math.random() * 10 });
    return parts;
  };

  function beginSmash(stage, opt) {
    opt = opt || {};
    if (Au.ctx) Au.hush();

    S = {
      hm: opt.hammer ? rawHammer(opt.hammer) : hammerById(store.hammer), stage, spb: 60 / stage.bpm, practice: false,
      // floor = 부순 바닥 수(= 지금 깊이), left = 지금 바닥에 남은 판자 수, hp = 맨 위 판자의 남은 단단함, cam = 지금까지 내려온 거리
      sm: { floor: 0, left: 1, hp: PLANK, start: -1, end: -1, over: false, hits: 0, planks: 0, cam: 0, off: 0, offAt: 0, beep: 3, popAt: -9, next: 0, loop: null },
      virtual: !!opt.virtual, bot: opt.bot || null, audio, t0: 0, base: 0, frozen: null, paused: false, done: false, ended: false,
      notes: [], marks: [], win: WIN, bars: 0, end: 0, lo: 0, sched: 0, ci: 0, vis: 0, score: 0, max: 0, combo: 0, maxCombo: 0, comboAt: -9,
      counts: { perfect: 0, good: 0, bad: 0, miss: 0 }, whiffs: 0, presses: 0, broken: 0, scareAt: -9, hopAt: -9,
      fx: [], strike: null, shakeAt: -9, shakeAmp: 0, zoom: 0, dipAt: -9, dipAmp: 0, res: null
    };
    if (audio) { S.sm.loop = Au.makeLoop(stage.bpm, stage.tr); S.t0 = Au.now(); }   // 반주는 미리 만들어 두고, 첫 망치질에 튼다
    else if (!opt.virtual) S.base = performance.now() / 1000;
  }

  /* 망치질 한 번. 힘만큼 맨 위 판자를 깎고, 판자가 부서지면 남은 힘이 아래 판자로 넘어간다. 마지막 판자가 부서지면 아래층으로 떨어진다 */
  function smashHit(t) {
    const m = S.sm, h = S.hm, toy = h.id === 'toy', heavy = h.id === 'sledge';
    if (m.over) return;
    if (m.start < 0) {                                   // 첫 망치질: 시계가 돌고 반주가 나온다
      m.start = t;
      if (S.audio && m.loop) { const at = Au.now() + 0.02; Au.loop(m.loop.buffer, at, at + SMASH_TIME); }
    }
    m.hits++;
    S.strike = { t, q: 'smash', seen: false, at: 0 };
    S.shakeAt = t;
    S.dipAt = t;
    for (let k = S.fx.length - 1; k >= 0; k--) if (S.fx[k].type === 6) S.fx.splice(k, 1);          // 앞 글자가 남아 있으면 지운다
    let pow = h.smash, planks = 0, fell = false;
    while (pow > 0) {
      const d = Math.min(pow, m.hp);
      m.hp -= d;
      pow -= d;
      if (m.hp > 0) break;
      planks++;                                          // 판자 한 장이 부서졌다: 두 토막이 양옆으로 튕겨 나가고 아래 것이 올라온다
      m.planks++;
      S.fx.push({ type: 8, under: true, t, life: 0.3, wy: m.cam, rot: Math.random() - 0.5 });
      m.left--;
      m.hp = PLANK;
      const drop = m.left > 0 ? PT : PT + ROOM;
      m.off = smashOff(m, t) + drop;
      m.offAt = t;
      m.cam += drop;
      if (m.left === 0) {                                // 바닥이 뚫렸다: 아래층으로 (남은 힘은 버린다)
        fell = true;
        m.floor++;
        m.left = layersOf(m.floor);
        m.popAt = t;
        break;
      }
    }
    S.fx.push({ type: 4, under: true, t, life: 0.25 });
    if (fell) {
      S.fx.push({ type: 7, t, life: 0.8, parts: chunkParts(lite ? 6 : 11) }, { type: 6, str: '우지끈!', t, life: 0.5, size: 92 },
        { type: 1, under: true, t, life: 0.13, r: 150, rot: Math.random() * 6 });
      S.shakeAmp = Math.min(22, 9 + 2.4 * h.smash); S.zoom = 0.04; S.dipAmp = 0;
      sfx('crack'); sfx(toy ? 'pyong' : heavy ? 'boom' : 'hitP'); buzz(30);
      if (m.floor % 10 === 0) sfx('combo');              // 열 층마다 딩동
    } else if (planks) {
      S.fx.push({ type: 7, t, life: 0.6, parts: chunkParts(lite ? 3 : 5) }, { type: 6, str: '쩍!', t, life: 0.36, size: 70 },
        { type: 1, under: true, t, life: 0.11, r: 110, rot: Math.random() * 6 });
      S.shakeAmp = Math.min(16, 5 + 1.6 * h.smash); S.zoom = 0.02; S.dipAmp = 0;
      sfx('crack', 0.5); sfx(toy ? 'pyong' : 'hitP', 0.8); buzz(12);
    } else {
      S.fx.push({ type: 6, str: toy ? '뿅' : '쿵', t, life: 0.25, size: 56 });
      S.shakeAmp = 2 + 0.8 * h.smash; S.zoom = 0; S.dipAmp = 5;

  }
  function advanceSmash(t) {
    const m = S.sm;
    if (S.bot && !m.over) while (m.next <= t) { smashHit(m.next); m.next += 1 / S.bot; }          // 자동으로 치는 손: 1초에 S.bot 번
    if (m.start >= 0 && !m.over) {
      const left = SMASH_TIME - (t - m.start);
      if (m.beep > 0 && left <= m.beep) { m.beep--; sfx('stick'); }                               // 마지막 3초: 딱, 딱, 딱
      if (left <= 0) { m.over = true; m.end = t; S.ended = true; sfx('end'); }
    }
    if (m.over && t - m.end >= 1.8 && !S.done) finishSmash();
  }
  function finishSmash() {
    const m = S.sm;
    S.done = true;

    if (S.virtual) return;

  }

    const r = S.res, rec = store.smash || (store.smash = {}), prev = rec[S.hm.id] || 0;
    if (r.depth > prev) { rec[S.hm.id] = r.depth; r.best = r.depth; r.fresh = prev > 0; save(); }
  }

  /* 바닥 하나: 판자 n 장을 겹쳐 그린다. f = 몇 번째 바닥, j0 = 맨 위 판자가 원래 몇 번째 겹이었나(결·이음매가 판자마다 다르게),

  function floorArt(y, f, n, j0, hp, bottom) {
    const vis = Math.min(n, Math.ceil((bottom - y) / PT));                   // 화면 아래로 벗어난 판자는 그리지 않는다
    if (vis <= 0) return;

    g.fillRect(-900, y, W + 1800, vis * PT);

      g.strokeStyle = LIGHT; g.lineWidth = 3;
      g.beginPath();

      }

      g.strokeStyle = INK; g.lineWidth = 3.5;
      g.beginPath();
      for (let k = 0; k < cn; k++) {
        const x = SX + [0, -46, 40][k] + ((s + k * 5) % 5) * 4 - 8, w = 8 + ((s + k * 3) % 4) * 3;
        g.moveTo(x, y + 2); g.lineTo(x - w, y + PT * 0.4); g.lineTo(x + w * 0.6, y + PT * 0.7); g.lineTo(x - w * 0.3, y + PT - 2);

  function drawSmash(t) {
    const m = S.sm, hm = S.hm;

    const sk = S.strike;

      if (!sk.seen) { sk.seen = true; sk.at = t - sk.t > 0.3 ? -9 : t; }

    drawFx(t, false);

    // 남은 시간과 지금 깊이 (망치 오른쪽의 빈 자리)
    const left = m.start < 0 ? SMASH_TIME : m.over ? 0 : Math.max(0, SMASH_TIME - (t - m.start));
    const cx = PORT ? 540 : 970, ty = PORT ? 100 : 132, hurry = m.start >= 0 && !m.over && left <= 5;
    pop(String(Math.ceil(left)), cx, ty, PORT ? 60 : 64, hurry ? 1 + 0.3 * (left - Math.floor(left)) : 1, INK, 900);
    rr(cx - 130, ty + 14, 260, 20, 10);
    g.fillStyle = PAPER; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    if (left > 0) { g.fillStyle = INK; g.fillRect(cx - 124, ty + 19, (248 * left) / SMASH_TIME, 10); }
    const pd = t - m.popAt, ps = pd >= 0 && pd < 0.18 ? 1 + 0.35 * (1 - pd / 0.18) : 1, best = (store.smash || {})[hm.id] || 0;
    if (m.floor > 0) text('지하', cx, ty + 94, 40, 'center', GRAY, 800);
    pop(m.floor > 0 ? m.floor + '층' : '1층', cx, ty + 204, PORT ? 110 : 120, ps, INK, 900);
    if (best) text('이 망치 최고 ' + depthName(best), cx, ty + 250, 24, 'center', GRAY, 700);
    if (m.start < 0) {                                   // 시작 전 안내
      const py = PY + PT + (PORT ? 150 : 96);
      pop(TOUCH ? '화면을 마구 눌러요!' : '스페이스를 마구 눌러요!', W / 2, py, PORT ? 46 : 44, 1 + 0.04 * Math.sin(t * 6), INK, 900);
      pop(SMASH_TIME + '초 동안 얼마나 깊이 내려갈까요?', W / 2, py + 52, 28, 1, GRAY, 700);
    }
    if (m.over) { const e = t - m.end; pop('끝!', PORT ? 360 : 560, PORT ? 620 : 400, 170, e < 0.15 ? lerp(1.6, 1, e / 0.15) : 1, INK, 900); }

    // 모드와 망치 이름, 멈춤 단추 (바닥이 화면 아래까지 차서 모두 위쪽에 둔다)

    text(SMASH.name + ' · ' + hm.name, lx, 66, 24, al, GRAY, 700);
    if (!S.virtual && (store.mute || !S.audio)) text(store.mute ? '소리 꺼 둠' : '소리 없이 진행 중', PORT ? lx : cx, PORT ? 94 : ty + 284, 20, PORT ? 'left' : 'center', GRAY, 700);

    g.fillStyle = INK; g.fillRect(bx + 32, 40, 10, 32); g.fillRect(bx + 50, 40, 10, 32);
    if (SHOWFPS) text(Math.round(1000 / avg) + '장/초 · ' + cv.width + '×' + cv.height + (lite ? ' · 가볍게' : ''), PORT ? W - 30 : 30, PORT ? H - 40 : 40, 24, PORT ? 'right' : 'left', GRAY, 700);
  }
  function drawSmashResult(r) {
    const x = W / 2, again = () => startStage(SMASH), hname = S.hm.name;
    text(SMASH.name + ' · ' + SMASH.sub + ' · ' + hname, x, PORT ? 170 : 90, PORT ? 32 : 36, 'center', GRAY, 800);
    if (r.depth > 0) {
      text(depthName(r.depth), x, PORT ? 470 : 290, PORT ? 140 : 170, 'center', INK, 900);
      text(r.fresh ? '새 기록!' : '까지 내려갔어요', x, PORT ? 552 : 362, 50, 'center', INK, 900);

      btn(130, 1024, 460, 92, '스테이지', () => go('select'), { size: 40 });

      btn(820, 560, 300, 92, '스테이지', () => go('select'), { size: 38 });
    }
  }

  const onPause = (p) => {
    if (S && S.sm && !PORT) return p.x >= W - 130 && p.y <= 98;              // 부수기(가로 화면): 멈춤 단추가 오른쪽 위에 있다
    return PORT ? p.x <= PBX + 106 && p.y <= PBY + 78 : p.x >= PBX - 10 && p.y >= PBY - 10;
  };

  /* ---------- 화면 방향과 전체화면 ----------
   * 화면 방향: 가로 화면(1280×720)과 세로 화면(720×1280) 가운데 고른다. 고른 것은 기기에 저장한다.

   * "홈 화면에 추가"로 깔아 여는 방법을 알려 준다 (그렇게 열면 주소창 없이 꽉 찬 화면이 된다) */
  const IOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const HELP_IOS = ['아이폰에서 전체화면으로 하려면', '1. 사파리의 공유 단추(네모에 화살표)를 눌러요', '2. "홈 화면에 추가"를 눌러요', '3. 홈 화면에 생긴 "톡쾅"으로 열어요', '그러면 주소창 없이 꽉 찬 화면으로 열려요'];

    try {
      const o = window.screen && window.screen.orientation;
      if (o && o.lock) { const p = o.lock(PORT ? 'portrait' : 'landscape'); if (p && p.catch) p.catch(() => null); }
    } catch (e) { /* 무시 */ }
  }

    if (fsEl()) { const ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) ex.call(document); return; }
    const fail = () => { if (!fsEl()) { modal = FULLHELP; dirty = true; } };
    if (!req) { fail(); return; }
    try { const p = req.call(el); if (p && p.catch) p.catch(fail); } catch (e) { fail(); return; }
    setTimeout(fail, 800);                               // 조용히 아무 일도 안 일어나는 기기도 있다
  }

  /* ---------- 화면 넘기기 ---------- */
  let wake = null;
  function keepAwake(on) {                               // 플레이 중에 화면이 꺼지지 않게
    try {
      if (on && navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then((w) => { wake = w; }, () => {});
      else if (!on && wake) { wake.release(); wake = null; }
    } catch (e) { /* 지원하지 않는 기기 */ }
  }
  function go(name) {
    screen = name;
    dirty = true;
    menuAt = performance.now();
    if (name === 'play') buttons = [];                   // 지난 메뉴의 단추가 플레이 중에 남아 있지 않게
    keepAwake(name === 'play');
  }
  let waiting = false;                                   // 소리 장치가 켜지기를 기다리는 중
  function startStage(st, opt) {
    let fired = false;
    const run = () => { if (fired) return; fired = true; waiting = false; begin(st, opt); newBest = false; go('play'); };
    const c = Au.ctx;
    if (!c || c.state === 'running') { run(); return; }
    // 소리 장치가 켜질 때까지 기다렸다가 시작한다 (못박자!와 같은 방식). 끝내 안 켜지면 소리 없이 시작한다
    waiting = true;
    dirty = true;
    c.resume().then(run, run);
    setTimeout(run, TEST ? 200 : 2500);
  }
  function pause() {
    if (!S || S.paused || S.done) return;
    S.frozen = now();
    S.paused = true;
    if (S.audio) Au.suspend();
    menuAt = performance.now();                          // 멈춤 단추를 누른 그 클릭이 곧바로 메뉴 단추까지 누르지 않게
    dirty = true;
  }
  function resume() {
    if (!S || !S.paused) return;
    if (S.audio) Au.resume(); else S.base = performance.now() / 1000 - S.frozen;
    S.frozen = null;
    S.paused = false;
  }
  function restart() { const st = S.stage; startStage(st); }
  function quit() {

   * 클릭은 어느 휴대폰에서나 소리 장치를 켤 수 있는 동작이다(못박자!가 이 방식이었고 아이폰에서 소리가 났다).
   * 그래서 메뉴에서는 터치를 막지 않고 그대로 두어, 손을 떼면 브라우저가 click 을 만들어 주게 한다. */
  const where = () => screen + (S && S.paused ? '/p' : '');
  const stamp = (e) => { const n = performance.now(), ts = e.timeStamp; return ts > 0 && Math.abs(n - ts) < 2000 ? ts : n; };
  const playing = () => screen === 'play' && !!S && !S.paused && !S.done;
  function hitAt(X, Y, ts) {
    if (onPause(toGame(X, Y))) pause(); else press(now() - Math.max(0, performance.now() - ts) / 1000);
  }
  function menuTap(X, Y) {
    if (playing() || waiting || performance.now() - menuAt < 500) return;    // 화면이 막 바뀐 직후의 두드림은 흘려보낸다
    const p = toGame(X, Y);
    for (let k = buttons.length - 1; k >= 0; k--) {
      const b = buttons[k];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { if (Au.running) Au.at('ui'); b.act(); dirty = true; return; }
    }
  }
  cv.addEventListener('touchstart', (e) => {
    Au.unlock();
    if (!playing()) return;                              // 메뉴: 막지 않는다 → 손을 떼면 click 이 온다
    e.preventDefault();                                  // 플레이: 바로 판정하고, 뒤따르는 click 은 만들지 않는다
    const ts = stamp(e);
    for (let k = 0; k < e.changedTouches.length; k++) hitAt(e.changedTouches[k].clientX, e.changedTouches[k].clientY, ts);
  }, { passive: false });
  cv.addEventListener('touchend', () => Au.unlock());
  cv.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  cv.addEventListener('mousedown', (e) => { Au.unlock(); if (playing()) hitAt(e.clientX, e.clientY, stamp(e)); });
  cv.addEventListener('click', (e) => { Au.unlock(); menuTap(e.clientX, e.clientY); });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (modal) { if (e.code === 'Space' || e.code === 'Enter' || e.code === 'Escape') { e.preventDefault(); modal = null; dirty = true; } return; }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      Au.unlock();
      if (screen === 'play' && S && !S.paused) press(now() - Math.max(0, performance.now() - stamp(e)) / 1000);
      else if (screen === 'play' && S) resume();
      else if (screen === 'title') go('select');
      else if (screen === 'result') startStage(S.stage);
    } else if (e.code === 'Escape' || e.code === 'KeyP') {
      if (screen === 'play' && S) { if (S.paused) resume(); else pause(); }
      else if (screen === 'select') go('title');
      else if (screen === 'result' || screen === 'hammers') go('select');
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !TEST && screen === 'play') pause(); });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 250));
  const onFull = () => { fit(); if (fsEl()) lockView(); };                   // 전체화면이 켜지거나 꺼지면 크기를 다시 맞춘다
  document.addEventListener('fullscreenchange', onFull);
  document.addEventListener('webkitfullscreenchange', onFull);

  /* ---------- 돌리기 ---------- */
  const next = TEST ? (fn) => setTimeout(fn, 16) : (fn) => requestAnimationFrame(fn);
  function frame() {
    if (screen === 'play' && S) {
      if (!S.paused) {
        const t = now();
        pace(performance.now());
        if (S.sm) { advanceSmash(t); if (screen === 'play') drawSmash(t); }
        else { advance(t); if (screen === 'play') { schedule(); drawPlay(t); } }
      } else if (dirty) { dirty = false; if (S.sm) drawSmash(S.frozen); else drawPlay(S.frozen); drawPause(); }
    } else if (dirty && screen !== 'demo') {
      dirty = false;
      if (screen === 'title') drawTitle(); else if (screen === 'select') drawSelect(); else if (screen === 'hammers') drawHammers();
      else if (S && S.res) drawResult(); else { screen = 'select'; drawSelect(); }
      drawModal();
    }
    next(frame);
  }
  fit();
  frame();

  /* ---------- 자동 검증과 손보기용 ---------- */
  window.TK = {
    /* 화면·소리 없이 계산으로만 한 판. until(박)을 주면 그 장면에서 멈춰 화면에 그려 둔다 */
    sim(id, bot, until, hammer) {                                            // hammer 를 주면 아직 안 열린 망치로도 돌려 볼 수 있다
      begin(stageById(id), { virtual: true, bot: bot || (id === 'smash' ? 6 : 'perfect'), hammer });
      for (let t = 0; !S.done; t += 0.004) {
        if (S.sm) {                                                          // 부수기 모드: bot = 1초에 치는 횟수, until = 초
          advanceSmash(t);
          if (until != null && t >= until) { S.frozen = t; go('play'); return { sec: +t.toFixed(2), depth: S.sm.floor, left: S.sm.left, hp: S.sm.hp, hits: S.sm.hits }; }
          continue;
        }
        advance(t);
        if (until != null && t / S.spb >= until) { S.frozen = t; go('play'); return { beat: +(t / S.spb).toFixed(2), score: S.score, combo: S.combo }; }
      }
      return S.res;
    },
    run(id, bot) { startStage(stageById(id), { bot: bot || null }); },      // 실제 시간으로 한 판 (bot 을 주면 자동으로 친다)
    clear(id, bot, hammer) {                                                 // 사람이 한 판을 마친 것처럼: 기록을 남기고 결과 화면까지 간다
      this.sim(id, bot, null, hammer);
      newBest = false;
      if (S.sm) recordSmash(); else if (!S.practice) record();
      go('result');
      return S.res;
    },
    perf(n) {                                                                // 한 화면을 그리는 데 걸리는 시간(ms)
      n = n || 300;
      const base = S.frozen != null ? S.frozen : now(), t0 = performance.now();
      for (let k = 0; k < n; k++) { if (S.sm) drawSmash(base + k * 0.004); else drawPlay(base + k * 0.004); }
      const ms = (performance.now() - t0) / n;
      S.ci = S.vis = 0;                                                      // 앞으로 감아 둔 것을 되돌린다
      return +ms.toFixed(4);
    },
    pace(dt, n) {                                                            // 화면 간격이 dt(ms)인 화면이 n 장 이어진 것처럼: 화질 자동 조절 시험용
      for (let k = 0; k < n; k++) pace(lastT + dt, true);
      return { cap: dprCap, lite, probe, fps: Math.round(1000 / avg), size: cv.width + 'x' + cv.height };
    },
    setView(v) { setView(v); return { port: PORT, W, H, SX, PX, D, PY, rot: V.rot, s: +V.s.toFixed(4), ox: +V.ox.toFixed(1), oy: +V.oy.toFixed(1) }; },   // 'land' | 'port'
    help(ios) { modal = ios ? HELP_IOS : FULLHELP; dirty = true; },          // 전체화면 안내 창 띄우기 (ios = 아이폰용 글로)
    full: toggleFull,
    go, pause, resume, store, save, STAGES, HAMMERS,
    demo(k, grip, hammerId) {                                                // 그림 점검용: 손과 못(또는 망치)을 크게 그려 둔다
      screen = 'demo';
      clear(); view(0, 0);
      g.save();
      g.translate(W / 2, PORT ? 900 : 640); g.scale(k || 2, k || 2);
      if (hammerId) { g.translate(-200 - HPX, -40 - HPY); hammer(-0.3, false, rawHammer(hammerId)); }
      else { nail(0, 0, null, 1, 30, -1); hand(0, -30 - NH + 6, grip || 0); }
      g.restore();
    },
    audio() { return Au.info(); },
    level() { return Au.level(); },
    get audioState() { return Au.state; },
    get screen() { return where(); },
    get state() {
      return S ? { beat: +(now() / S.spb).toFixed(2), audio: S.audio, score: S.score, max: S.max, combo: S.combo, counts: S.counts, presses: S.presses, whiffs: S.whiffs, done: S.done, paused: S.paused, fx: S.fx.length } : null;
    },
    get view() { return V; }
  };
})();
</script>
</body>
